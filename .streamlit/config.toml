# Streamlit runtime + theme settings.
# Committed on purpose: every workstation should render the dashboard the same.

[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f5f3"
textColor = "#12120f"
font = "sans serif"

[server]
# Bind to every interface so the dashboard is reachable from a phone on the
# same network. Set to "localhost" to restrict it to this machine.
address = "0.0.0.0"
port = 8501
headless = true
# Reruns on file change are a developer convenience, not a reporting one.
fileWatcherType = "auto"
maxUploadSize = 50

[browser]
gatherUsageStats = false

[client]
showErrorDetails = "full"
toolbarMode = "minimal"
