# =============================================================================
# Executive Dashboard -- configuration
# -----------------------------------------------------------------------------
# Copy this file to config/config.yaml and edit it for the machine you are on.
# config/config.yaml is git-ignored, so every workstation keeps its own paths
# and nothing local ever lands in the repository.
#
#   cp config/config.example.yaml config/config.yaml
#
# If config/config.yaml is missing the app falls back to this file, so a fresh
# clone runs immediately against the generated sample workbooks.
# =============================================================================

app:
  title: "Executive Dashboard"
  organization: "Moar Lyfe"
  # IANA timezone that defines "today". Everything -- period boundaries,
  # working-day counts, projections -- is anchored to this zone.
  timezone: "America/New_York"
  # Currency prefix used when rendering premium figures.
  currency_symbol: "$"

# -----------------------------------------------------------------------------
# WHERE THE DATA COMES FROM
# -----------------------------------------------------------------------------
# Each source is a folder plus a glob. Relative paths resolve against the
# project root, so a network share is just an absolute path:
#
#   - path: "//fileserver/reports/daily"      (Windows UNC)
#   - path: "/Volumes/Reports/daily"          (macOS)
#   - path: "Z:/Shared/Production"            (mapped drive)
#
# Every matching workbook is read and stacked into one table, so a folder of
# monthly exports works exactly like a single master file.
# -----------------------------------------------------------------------------
data:
  sources:
    - name: "sample"
      path: "data/sample"
      glob: "*.xlsx"
      # Sheet to read: a name ("Production"), a zero-based index (0),
      # null for the first sheet, or "*" for every sheet in the workbook.
      sheet: null
      # Zero-based row that holds the column headers (2 if the export has a
      # two-line title block above the header row).
      header_row: 0
      recursive: false

  # ---------------------------------------------------------------------------
  # COLUMN MAPPING
  # ---------------------------------------------------------------------------
  # Maps the dashboard's canonical fields onto whatever the workbook calls
  # them. Matching is case-insensitive and ignores extra whitespace, so
  # "Written  Premium" matches "written premium". List as many aliases as you
  # need -- the first one present in a sheet wins. Add your real headers here;
  # the Diagnostics page shows exactly what resolved and what did not.
  # ---------------------------------------------------------------------------
  columns:
    date: ["Date", "Sale Date", "Effective Date", "Issue Date", "Submitted"]
    premium: ["Premium", "Written Premium", "Annual Premium", "AP", "Amount"]
    agent: ["Agent", "Agent Name", "Producer", "Writing Agent", "Rep"]
    category: ["Category", "Product", "Product Type", "Line", "Line of Business"]
    channel: ["Channel", "Source", "Lead Source", "Origin"]
    policy_id: ["Policy", "Policy Number", "Policy #", "App ID", "Application"]
    # Optional. When present each row contributes this many sales instead of 1.
    count: ["Units", "Count", "Items", "Policies"]

  # ---------------------------------------------------------------------------
  # THE TWO REPORTED CATEGORIES
  # ---------------------------------------------------------------------------
  # `label` is what the dashboard prints. `values` are the raw strings found in
  # the category column, matched case-insensitively. Anything that matches
  # neither list still counts toward Total Sales and Premium but is bucketed as
  # "Other" -- Diagnostics lists unmatched values so nothing hides.
  # ---------------------------------------------------------------------------
  categories:
    category_1:
      label: "Category 1"
      values: ["Category 1", "Cat 1", "Life", "Term Life", "Whole Life"]
    category_2:
      label: "Category 2"
      values: ["Category 2", "Cat 2", "Health", "Medicare", "Supplement"]
    other_label: "Other"

  # ---------------------------------------------------------------------------
  # WEB SALES
  # ---------------------------------------------------------------------------
  # A row is a web sale when its channel OR its agent matches one of these.
  # The "Include web sales" toggle on the dashboard switches these rows in and
  # out of every KPI, table and projection.
  # ---------------------------------------------------------------------------
  web_sales:
    channel_values: ["Web", "Online", "Website", "Internet", "Direct Web"]
    agent_values: ["WEB", "Web Sales", "House", "House Account"]

  # Drop repeated rows when the same workbook is exported twice. Disabled by
  # default so nothing disappears silently.
  dedupe:
    enabled: false
    keys: ["policy_id", "date"]

# -----------------------------------------------------------------------------
# WORKING CALENDAR -- drives every projection
# -----------------------------------------------------------------------------
calendar:
  # Weekdays that are never working days.
  exclude_weekdays: ["Sunday"]

  holidays:
    # Enabled observances. Available keys:
    #   new_years_day, mlk_day, presidents_day, good_friday, memorial_day,
    #   juneteenth, independence_day, labor_day, columbus_day, veterans_day,
    #   thanksgiving, day_after_thanksgiving, christmas_eve, christmas_day,
    #   new_years_eve
    observed:
      - new_years_day
      - memorial_day
      - independence_day
      - labor_day
      - thanksgiving
      - christmas_day
    # A holiday landing on an already-excluded day (e.g. Sunday) would cost
    # nothing, so shift it to the next working day instead.
    shift_to_next_working_day: true
    # One-off closures: office days, storm days, anything else.
    extra_dates: []
    # Force a date to count as a working day even if a rule above excluded it.
    working_overrides: []

# -----------------------------------------------------------------------------
# PROJECTIONS
# -----------------------------------------------------------------------------
# projected = actual_to_date / working_days_elapsed * working_days_in_period
projection:
  enabled: true
  # Count today as an elapsed working day. true matches "total days divided by
  # days passed" literally; false projects off completed days only, which runs
  # optimistic early in the morning instead of pessimistic.
  count_today_as_elapsed: true
  # Periods that get a projection. Daily/rolling windows have no meaningful
  # end state, so only month and year are projected.
  periods: ["month", "year"]

# -----------------------------------------------------------------------------
# ANALYTICS -- moving averages and alerting
# -----------------------------------------------------------------------------
# Watches each KPI as a trailing moving average and raises an alert when one
# slips. Averages are per WORKING day, so a window holding three Sundays is not
# penalised against one holding two.
# -----------------------------------------------------------------------------
analytics:
  enabled: true
  # Windows offered on the Analytics page, in days. Any window a rule names is
  # computed whether or not it is listed here.
  windows: [15, 30, 45, 90]
  # working_days (recommended) or calendar_days.
  basis: "working_days"
  # A rule reports "not enough data" below this much history rather than
  # averaging over a partial window.
  min_history_days: 30
  # Also judge each agent against their own baseline.
  monitor_agents: true
  # Agents below this many sales in the baseline window are too small for a
  # percentage swing to mean anything.
  agent_min_sales: 5

  # ---------------------------------------------------------------------------
  # PRESETS
  # ---------------------------------------------------------------------------
  # Used when `rules` below is empty. A preset needs no targets: every metric is
  # judged against its own history, so it works on day one.
  #   standard  -- premium and sales at 15d vs 90d, categories at 30d vs 90d
  #   sensitive -- tighter tolerances, extra windows, plus a 45-day trend rule
  #   minimal   -- premium only, quiet
  #   none      -- no rules; the page still charts the averages
  preset: "standard"

  # ---------------------------------------------------------------------------
  # DATA HEALTH -- checks on the feed, not on what it says
  # ---------------------------------------------------------------------------
  # A broken export and a bad sales week look identical in a moving average: if
  # the file stops updating, recent days become zeros and the short window
  # collapses. Without these checks the dashboard would confidently report a
  # 40% premium slide caused by a dead scheduled job.
  #
  # These sort above the performance rules, and a critical one puts a banner on
  # the Dashboard saying the figures below may be wrong.
  # ---------------------------------------------------------------------------
  data_health:
    enabled: true
    # Working days between the newest row and today. Counted in WORKING days,
    # so a Sunday or a long holiday weekend never reads as a broken pipeline.
    stale_warn_days: 2
    stale_critical_days: 4
    # Recent rows per working day against a longer baseline -- catches the
    # partial export that arrives on time but carries a fraction of the rows,
    # which the freshness check alone cannot see.
    volume_window: 15
    volume_baseline: 90
    volume_warn_pct: 30
    volume_critical_pct: 50
    # Alert when a workbook cannot be read, or a source matches no files at
    # all, instead of leaving it on Diagnostics for someone to find later.
    check_sources: true

  # ---------------------------------------------------------------------------
  # RULES -- anything here replaces the preset entirely
  # ---------------------------------------------------------------------------
  # Three kinds, covering both ways a metric can be judged:
  #
  #   kind: threshold   DEFINED. You state the number the average must hold.
  #                     Needs `operator` (min = floor, max = ceiling) and
  #                     `warn` / `critical` as PER-WORKING-DAY values.
  #
  #   kind: relative    UNDEFINED. No number needed -- the short window is
  #                     judged against the metric's own longer `baseline`, so
  #                     the rule calibrates itself and survives growth.
  #                     Needs `warn_pct` / `critical_pct` (shortfall %).
  #
  #   kind: trend       The same window against where it stood
  #                     `lookback_days` ago -- catches a slide that a stable
  #                     baseline would hide. Needs `warn_pct` / `critical_pct`.
  #
  # metric is one of: premium, sales, category_1, category_2
  rules: []
  # Worked examples -- uncomment and edit:
  #
  # rules:
  #   - name: "Premium vs 90-day baseline"
  #     metric: premium
  #     kind: relative
  #     window: 15
  #     baseline: 90
  #     warn_pct: 10          # 15-day average 10% below the 90-day baseline
  #     critical_pct: 20
  #
  #   - name: "Category 1 daily floor"
  #     metric: category_1
  #     kind: threshold
  #     window: 30
  #     operator: min
  #     warn: 2.0             # fewer than 2 sales per working day
  #     critical: 1.5
  #
  #   - name: "Premium slide since last month"
  #     metric: premium
  #     kind: trend
  #     window: 30
  #     lookback_days: 30
  #     warn_pct: 8
  #     critical_pct: 15
  #
  #   - name: "Retired rule"
  #     metric: sales
  #     kind: relative
  #     window: 15
  #     warn_pct: 10
  #     enabled: false        # kept on file, never evaluated

# -----------------------------------------------------------------------------
# TARGETS
# -----------------------------------------------------------------------------
# A projection says where the month will land. A target says whether that is
# good enough -- and what the remaining working days need to close the gap.
#
# Targets are PERIOD TOTALS (a whole month, a whole year), not daily rates. The
# dashboard derives attainment, projected attainment, and the per-working-day
# pace required, all against the same working calendar as everything else.
#
# An absent target means "no target" -- never zero. Leave a metric out and its
# card simply shows the projection instead.
# -----------------------------------------------------------------------------
targets:
  enabled: true
  # premium:
  #   month: 700000
  #   year: 8500000
  # sales:
  #   month: 200
  #   year: 2400
  # category_1:
  #   month: 90
  # category_2:
  #   month: 85
  #
  # A month that is not like the others -- open enrolment, a slow August:
  # overrides:
  #   premium:
  #     "2026-12": 950000
  #     "2026-08": 500000

# -----------------------------------------------------------------------------
# SNAPSHOTS -- a record of what was reported
# -----------------------------------------------------------------------------
# Every figure on the dashboard is recomputed from the workbooks as they stand
# right now, which quietly means history moves: a corrected row or a re-export
# changes what last month "was". A nightly snapshot freezes what was reported,
# so "what did we report on September 1?" is answerable, and a restatement is
# visible instead of invisible.
#
# Schedule `python tools/snapshot_kpis.py` after whatever refreshes the
# workbooks. It exits 1 when a closed day's figure has moved.
# -----------------------------------------------------------------------------
snapshots:
  enabled: true
  directory: "runtime/snapshots"
  # Trailing days captured each run, for detecting changes to closed days.
  daily_days: 45
  # Below this, a difference is float noise rather than a restatement.
  restatement_tolerance: 0.01

# -----------------------------------------------------------------------------
# ADMIN PANEL
# -----------------------------------------------------------------------------
admin:
  enabled: true
  # Folder holding the Python scripts the panel can run. Point this anywhere:
  #   scripts_dir: "/home/ops/etl"
  #   scripts_dir: "C:/Reporting/jobs"
  scripts_dir: "scripts"
  scripts_glob: "*.py"
  recursive: false
  # Working directory for each run. null = the script's own folder.
  working_dir: null
  # Hard stop for a single script, in seconds.
  timeout_seconds: 3600
  # Optional gate. When set, the panel asks for the value held in this
  # environment variable. Leave null for no password.
  password_env: null
  # Extra environment variables handed to every script.
  environment: {}
